<body class="text-[#1C1C1E]">
<div id="root" data-booting="true"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2F2EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#6c6c70">週報載入中…</div></div>

<script>
(function () {
  function showFatal(message) {
    var root = document.getElementById('root');
    if (!root) return;
    root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F2F2EE;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">' +
      '<div style="max-width:640px;background:#fff;border:1px solid #fecaca;border-radius:24px;padding:32px;box-shadow:0 16px 40px rgba(0,0,0,.08);text-align:center">' +
      '<div style="font-size:40px;margin-bottom:12px">⚠️</div>' +
      '<h1 style="font-size:22px;margin:0 0 12px;color:#1c1c1e">週報程式無法啟動</h1>' +
      '<p style="font-size:14px;line-height:1.7;color:#6c6c70;word-break:break-word;margin:0">' + String(message || '未知錯誤').replace(/[&<>"\']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[c];}) + '</p>' +
      '<p style="font-size:12px;line-height:1.6;color:#8e8e93;margin:16px 0 0">請截圖此訊息提供給網站管理者。</p>' +
      '</div></div>';
  }
  window.addEventListener('error', function (event) {
    if (!document.getElementById('root').textContent.trim() || document.getElementById('root').dataset.booting === 'true') {
      showFatal(event.message || 'JavaScript 載入失敗');
    }
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason && (event.reason.message || String(event.reason));
    if (!document.getElementById('root').textContent.trim() || document.getElementById('root').dataset.booting === 'true') {
      showFatal(reason || '非同步程式執行失敗');
    }
  });

<script id="sunday-location-addon">
(function () {
  const DATA_URL = window.__WEEKLY_DATA_URL__ || 'https://royal-chosen-race-default-rtdb.firebaseio.com/bulletin_data.json';
  const FALLBACK_LOCATION = '台北科技大學宏裕科技大樓B2國際會議廳（捷運忠孝新生站4號出口）';
  let sundayLocation = FALLBACK_LOCATION;

  function findContactList() {
    const headings = Array.from(document.querySelectorAll('h4'));
    const contactHeading = headings.find(el => /聯絡我們|CONTACT/.test(el.textContent || ''));
    if (!contactHeading) return null;
    const contactColumn = contactHeading.closest('.text-left') || contactHeading.parentElement?.parentElement;
    if (!contactColumn) return null;
    return contactColumn.querySelector('.space-y-4');
  }

  function ensureSundayCard() {
    const list = findContactList();
    if (!list) return false;

    let card = list.querySelector('[data-sunday-location-card="true"]');
    if (!card) {
      const addressCards = Array.from(list.querySelectorAll('a'));
      const template = addressCards.find(a => /馬可樓辦公室地址|ADDRESS/.test(a.textContent || ''));
      if (!template) return false;

      card = template.cloneNode(true);
      card.dataset.sundayLocationCard = 'true';
      card.setAttribute('aria-label', '主日聚會地點導航');
      list.appendChild(card);
    }

    card.href = 'https://maps.app.goo.gl/uUBga4M5QaY8YSdj8;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const ps = card.querySelectorAll('p');
    if (ps[0] && ps[0].textContent !== '主日聚會地點 SUNDAY SERVICE') ps[0].textContent = '主日聚會地點 SUNDAY SERVICE';
    if (ps[1] && ps[1].textContent !== sundayLocation) ps[1].textContent = sundayLocation;
    return true;
  }

  async function loadSundayLocation() {
    try {
      const response = await fetch(DATA_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const value = data && data.office && data.office.sundayLocation;
      if (typeof value === 'string' && value.trim()) sundayLocation = value.trim();
    } catch (err) {
      console.warn('[Sunday location] 使用預設主日聚會地點：', err);
    }
    ensureSundayCard();
  }

  const observer = new MutationObserver(() => ensureSundayCard());
  const root = document.getElementById('root');
  if (root) observer.observe(root, { childList: true, subtree: true });

  window.addEventListener('DOMContentLoaded', ensureSundayCard);
  setTimeout(ensureSundayCard, 0);
  setTimeout(ensureSundayCard, 500);
  loadSundayLocation();
})();
</script>
